# Sensors come from the Android sensors HAL (bmi220 accel/gyro, mmc56x3x
# magnetometer, ltr308 light, vl53lx proximity).
[plugins]
accelerometeradaptor = hidlaccelerometeradaptor
alsadaptor = hidlalsadaptor
proximityadaptor = hidlproximityadaptor
magnetometeradaptor = hidlmagnetometeradaptor
gyroscopeadaptor = hidlgyroscopeadaptor
orientationadaptor = hidlorientationadaptor

# The HAL reports in Android's portrait frame, while the panel is driven as a
# landscape display (stock uses primary_display_orientation=270). Rotate the
# axes by 90 degrees about Z so "top up" matches the landscape display, in the
# same direction as the touch rotation in 71-q706f-input.rules.
[accelerometer]
transformation_matrix = "0,-1,0,1,0,0,0,0,1"

[magnetometer]
transformation_matrix = "0,-1,0,1,0,0,0,0,1"
needs_calibration = 0
