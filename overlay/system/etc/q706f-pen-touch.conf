# Settings for q706f-pen-touch (Lenovo Precision Pen as a touch contact).
#
# The Precision Pen 3 has ONE physical barrel button and reports it as BTN_STYLUS2
# ("button2"); BTN_STYLUS ("button1") never occurs. While the button is pressed the
# Goodix driver also drops BTN_TOUCH/BTN_TOOL_PEN.
#
# The button sends Escape ("back": closes dialogs, menus and open lists). Chosen by the
# user on 2026-11-12; a long press with the tip already gives the context menu, so the
# "longpress" action would be redundant on this button.
#
# Possible values: hold | longpress | none | key:KEY_A+KEY_B   (e.g. key:KEY_LEFTCTRL+KEY_Z)
pressure = on
button1 = none
button2 = key:KEY_ESC
