# The cache-wipe helper exits with an error on installs that are not driven by
# system-image, which made the whole unit fail and left the system profiles
# unloaded at boot. Keep running it, but do not let it block profile loading.
[Service]
ExecStartPre=
ExecStartPre=-/usr/libexec/lxc-android-config/wipe-aa-cache-on-channel-switch.py
